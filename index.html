<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>بوصلة | مرشدك للمسار الوظيفي</title>
  <meta name="description" content="بوصلة: وكيل ذكاء اصطناعي لإرشاد طلاب نظم المعلومات الإدارية إلى المسار الوظيفي المناسب">
  <meta name="theme-color" content="#0F2A44">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='21' fill='%230F2A44' stroke='%23D4A537' stroke-width='3'/%3E%3Cpath d='M24 8l5 16h-10z' fill='%23D4A537'/%3E%3Cpath d='M24 40l-5-16h10z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // تطبيق اللغة والوضع المحفوظين قبل الرسم لتجنب الوميض
    try {
      var q = new URLSearchParams(location.search);
      var lang = q.get('lang') || localStorage.getItem('bosla-lang');
      if (lang === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
      var theme = localStorage.getItem('bosla-theme');
      if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="3"/>
      <g class="needle">
        <path d="M24 8l5.5 16h-11z" fill="#D4A537"/>
        <path d="M24 40l-5.5-16h11z" fill="#fff"/>
      </g>
      <circle cx="24" cy="24" r="2.6" fill="#0F2A44"/>
    </svg>
    <h1 data-i18n="brand">بوصلة</h1>
    <p class="tagline" data-i18n="tagline">وكيل ذكاء اصطناعي لإرشاد طلاب نظم المعلومات الإدارية إلى المسار الوظيفي المناسب</p>
    <div class="actions">
      <button id="lang-toggle" class="icon-btn" type="button" aria-label="Switch to English" title="Switch to English">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span class="lang-code">EN</span>
      </button>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="تفعيل الوضع الداكن" title="تفعيل الوضع الداكن">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="new-chat" class="new-chat" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span data-i18n="newChat">محادثة جديدة</span>
      </button>
    </div>
  </header>

  <div id="progress" class="progress" hidden>
    <div class="progress-track"><i class="progress-fill"></i></div>
    <span class="progress-text"></span>
  </div>

  <main id="chat" class="chat" aria-live="polite"></main>

  <form id="composer" class="composer" autocomplete="off">
    <input id="input" type="text" placeholder="اكتب رسالتك…" maxlength="500">
    <button id="send" type="submit" aria-label="إرسال">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="send-arrow" d="M20 12L4 4l3 8-3 8z" fill="currentColor"/></svg>
    </button>
  </form>
  <footer class="foot" data-i18n="footer">مشروع مقرر نظم معلومات إدارية متقدمة – جامعة الطائف</footer>

  <noscript><p class="noscript">يتطلب "بوصلة" تفعيل JavaScript في المتصفح.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
